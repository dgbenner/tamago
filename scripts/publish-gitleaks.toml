# The secret scan for the published Storybook (scripts/publish-storybook.sh): gitleaks' own rules, minus one known
# false alarm in a bundled library.
[extend]
useDefault = true

# react-element-to-jsx-string, minified: `a=e.key,o=e.childrens` is two variable assignments, not a key. Only this
# exact piece of code is let through; anything else that looks like a key still stops the publish.
[[allowlists]]
description = "minified library code: a variable assignment after .key"
regexTarget = "match"
regexes = ['''key,[a-zA-Z_$]{1,3}=[a-zA-Z_$]{1,3}\.childrens''']
