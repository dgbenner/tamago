[build]
  command = "npm run build"
  publish = "dist"
  # Netlify is retired (2026-11-09): hosting is Cloudflare Pages, and builds are also stopped in Netlify's settings.
  # An ignore command that exits 0 makes Netlify skip the build for every push, so commits reach GitHub without
  # deploying there.
  ignore = "exit 0"

# The service worker must never be cached by the browser, or updates stop arriving.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
