[build]
  command = "npm run build"
  publish = "dist"
  # Deploys are paused (Dan, 2026-11-09: the account is at 50% of its monthly credits). An ignore command that
  # exits 0 makes Netlify skip the build for every push, so commits reach GitHub without deploying. Remove this
  # line only when Dan says to deploy; hosting is moving to Cloudflare.
  ignore = "exit 0"

# The service worker must never be cached by the browser, or updates stop arriving.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
