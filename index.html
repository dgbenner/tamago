<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tamago</title>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fffbf2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#12100d" />
    <!-- The page color from the first moment (Dan, 2026-11-19), before the app's own styles and code arrive, so the
         wait is never the browser's black or white. -->
    <style>html { background: #fffbf2; } @media (prefers-color-scheme: dark) { html { background: #12100d; } }</style>
    <link rel="icon" type="image/png" href="/icon-32.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" as="image" href="/logo.webp" type="image/webp" />
    <!-- The language flags, fetched from the start so they're there the moment the first-launch question shows. -->
    <link rel="preload" as="image" href="/flags/fr.webp" />
    <link rel="preload" as="image" href="/flags/es.webp" />
    <link rel="preload" as="image" href="/flags/de.webp" />
  </head>
  <body>
    <!-- The sushi mark from the first moment (Dan, 2026-11-23): plain HTML in the page, so a slow load on weak Wi-Fi shows
         the logo, not an empty screen. React replaces it when the app starts. -->
    <div id="root"><img src="/logo.webp" width="384" height="256" alt="Tamago" decoding="sync"
      style="position: fixed; inset: 0; margin: auto; width: 7.5rem; height: auto; aspect-ratio: 3 / 2;" /></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
